spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/staffmatch_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Flyway owns schema changes (db/migration). Hibernate only validates the DB matches entities.
# For one-off local experiments only, set JPA_DDL_AUTO=update — do not use update in shared or deployed environments.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
app.admin.seed.email=${ADMIN_SEED_EMAIL:}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:}
app.admin.seed.name=${ADMIN_SEED_NAME:Platform Admin}
app.demo-tools-enabled=${DEMO_TOOLS_ENABLED:false}
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.demo-seed.password=${DEMO_SEED_PASSWORD:StaffMatch2026!}

# AI matching: ollama (default, direct local Ollama) | n8n (webhook workflows) | none (built-in scores only)
app.matching.provider=${MATCHING_PROVIDER:ollama}
app.matching.enabled=${MATCHING_ENABLED:true}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}

n8n.matching-enabled=${N8N_MATCHING_ENABLED:true}
n8n.worker-match-webhook-url=${N8N_WORKER_MATCH_WEBHOOK_URL:http://localhost:5678/webhook/staffmatch/worker-shift-match}
n8n.manager-match-webhook-url=${N8N_MANAGER_MATCH_WEBHOOK_URL:http://localhost:5678/webhook/staffmatch/manager-applicant-match}
n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}
n8n.match-source=${N8N_MATCH_SOURCE:N8N_OLLAMA}
n8n.notification-enabled=${N8N_NOTIFICATION_ENABLED:false}
n8n.notification-webhook-url=${N8N_NOTIFICATION_WEBHOOK_URL:http://localhost:5678/webhook/smart-hiring/notification-email}
n8n.notification-dispatch-initial-delay-ms=${N8N_NOTIFICATION_INITIAL_DELAY_MS:10000}
n8n.notification-dispatch-delay-ms=${N8N_NOTIFICATION_DISPATCH_DELAY_MS:30000}
n8n.shift-draft-webhook-url=${N8N_SHIFT_DRAFT_WEBHOOK_URL:http://localhost:5678/webhook/staffmatch/shift-draft}
n8n.shift-search-webhook-url=${N8N_SHIFT_SEARCH_WEBHOOK_URL:http://localhost:5678/webhook/staffmatch/shift-search}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.requests=${RATE_LIMIT_LOGIN_REQUESTS:10}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}
app.rate-limit.register.requests=${RATE_LIMIT_REGISTER_REQUESTS:5}
app.rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:600}
app.rate-limit.matching.requests=${RATE_LIMIT_MATCHING_REQUESTS:60}
app.rate-limit.matching.window-seconds=${RATE_LIMIT_MATCHING_WINDOW_SECONDS:3600}
app.rate-limit.applications.requests=${RATE_LIMIT_APPLICATION_REQUESTS:30}
app.rate-limit.applications.window-seconds=${RATE_LIMIT_APPLICATION_WINDOW_SECONDS:3600}
app.rate-limit.chat.requests=${RATE_LIMIT_CHAT_REQUESTS:60}
app.rate-limit.chat.window-seconds=${RATE_LIMIT_CHAT_WINDOW_SECONDS:60}
app.rate-limit.shift-draft.requests=${RATE_LIMIT_SHIFT_DRAFT_REQUESTS:20}
app.rate-limit.shift-draft.window-seconds=${RATE_LIMIT_SHIFT_DRAFT_WINDOW_SECONDS:3600}
