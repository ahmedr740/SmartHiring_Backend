name: smart-hiring

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      STAFFMATCH_DB_PASSWORD: ${STAFFMATCH_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      TZ: Asia/Hong_Kong
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/staffmatch_prod
      DATABASE_USERNAME: staffmatch_app
      DATABASE_PASSWORD: ${STAFFMATCH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      APP_PUBLIC_URL: https://${DOMAIN}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      DEMO_TOOLS_ENABLED: "false"
      DEMO_SEED_ENABLED: "false"
      MATCHING_PROVIDER: n8n
      MATCHING_ENABLED: "true"
      N8N_MATCHING_ENABLED: "true"
      N8N_WORKER_MATCH_WEBHOOK_URL: http://n8n:5678/webhook/staffmatch/worker-shift-match
      N8N_MANAGER_MATCH_WEBHOOK_URL: http://n8n:5678/webhook/staffmatch/manager-applicant-match
      N8N_SHIFT_DRAFT_WEBHOOK_URL: http://n8n:5678/webhook/staffmatch/shift-draft
      N8N_SHIFT_SEARCH_WEBHOOK_URL: http://n8n:5678/webhook/staffmatch/shift-search
      N8N_MATCH_SOURCE: N8N_DEEPSEEK
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_NOTIFICATION_ENABLED: ${N8N_NOTIFICATION_ENABLED:-false}
      N8N_NOTIFICATION_WEBHOOK_URL: http://n8n:5678/webhook/smart-hiring/notification-email
      RATE_LIMIT_ENABLED: "true"
      JAVA_OPTS: -Xms128m -Xmx768m -XX:+UseG1GC
      TZ: Asia/Hong_Kong
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 1024m
    networks: [internal]

  frontend:
    build:
      context: ./staffmatch-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: https://api.${DOMAIN}/api
        REACT_APP_DEMO_MODE: "false"
        GENERATE_SOURCEMAP: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    networks: [internal]

  n8n:
    image: n8nio/n8n:2.26.8
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_prod
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_SSL_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: automation.${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://automation.${DOMAIN}
      WEBHOOK_URL: https://automation.${DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 5000
      NODE_OPTIONS: --max-old-space-size=768
      GENERIC_TIMEZONE: Asia/Hong_Kong
      TZ: Asia/Hong_Kong
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1024m
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: Asia/Hong_Kong
    command: ["sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
      N8N_PROXY_USER: ${N8N_PROXY_USER}
      N8N_PROXY_PASSWORD_HASH: ${N8N_PROXY_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - n8n
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
